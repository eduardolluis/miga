name: miga
description: "Miga is a mobile app that helps you plan weekly meals, discover recipes, and create a grocery list based on your household's preferences and budget."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.3.2
  google_sign_in: ^7.2.0
  google_sign_in_ios: ^6.3.2
  google_sign_in_platform_interface: ^3.1.0
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/miga-app-icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/google.svg
    - assets/images/onboarding/
    - assets/images/home/
    - assets/fonts/OFL.txt
  fonts:
    - family: LiberationSerif
      fonts:
        - asset: assets/fonts/LiberationSerif-Regular.ttf
